name: Nifty 500 Loader

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 1,4,7,10 *'

jobs:
  load-nifty500:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 Loader
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
        run: python scripts/load_nifty500.py
