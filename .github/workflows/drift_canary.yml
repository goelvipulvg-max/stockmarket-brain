name: Verifier Drift Canary

on:
  schedule:
    - cron: '30 4 * * 0'   # Sunday 10:00 IST — market closed; weekly band fires reliably (Jul-12 report §3.2)
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exit codes: 0 = GREEN (ping sent), 1 = RED drift alert, 2 = CANARY FAILED.
      # Non-zero marks the run red -> GH failure email is the secondary channel
      # if Telegram itself is down. The canary never reports GREEN on partial data.
      - name: Run drift canary (compare vs committed baseline)
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TIER3_CHANNEL: ${{ secrets.TELEGRAM_TIER3_CHANNEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u -m agents.drift_canary
