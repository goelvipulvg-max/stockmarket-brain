name: Tier-1 Guardian

on:
  workflow_dispatch:
  schedule:
    # Every 30 min during extended Indian market hours (8:30 AM - 7:00 PM IST = 3:00-13:30 UTC)
    # Mon-Fri only, covers pre-market + regular session + post-market
    - cron: '*/30 3-13 * * 1-5'

jobs:
  run-tier1-guardian:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tier-1 Guardian Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GUARDIAN_CHANNEL: ${{ secrets.TELEGRAM_GUARDIAN_CHANNEL }}
        run: python agents/tier1_guardian.py
