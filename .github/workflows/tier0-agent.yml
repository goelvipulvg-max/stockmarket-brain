name: Tier-0 Filing Agent

on:
  workflow_dispatch:  # Manual trigger button on GitHub
  schedule:
    # EMERGENCY FALLBACK ONLY — ~30-min coverage during NSE market hours
    # (9:15 AM - 3:30 PM IST = 3:45-10:00 UTC, Mon-Fri).
    # PRIMARY trigger is cron-job.org at 5-min intervals.
    # These GitHub cron lines fire only if cron-job.org is down.
    - cron: '15,45 3-9 * * 1-5'
    - cron: '0,30 4-9 * * 1-5'

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "UPSTOX_API_KEY=${{ secrets.UPSTOX_API_KEY }}" >> .env
          echo "UPSTOX_API_SECRET=${{ secrets.UPSTOX_API_SECRET }}" >> .env
          echo "UPSTOX_ACCESS_TOKEN=${{ secrets.UPSTOX_ACCESS_TOKEN }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_MOVERS_CHANNEL=${{ secrets.TELEGRAM_MOVERS_CHANNEL }}" >> .env
          echo "TELEGRAM_LT_CHANNEL=${{ secrets.TELEGRAM_LT_CHANNEL }}" >> .env
          echo "TELEGRAM_SWING_CHANNEL=${{ secrets.TELEGRAM_SWING_CHANNEL }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}" >> .env
          echo "PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}" >> .env
          echo "PINECONE_ENVIRONMENT=${{ secrets.PINECONE_ENVIRONMENT }}" >> .env

      - name: Run Tier-0 Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TRADES_CHANNEL_ID: ${{ secrets.TELEGRAM_TRADES_CHANNEL_ID }}
          USE_NEW_DEDUP_KEY: "true"
        run: python agents/tier0_filings.py
