name: Tier-4 Memory Manager

on:
  # P3-6: nightly cadence (was on.workflow_run: ["Update Paper Trades"]). The agent
  # upserts ONE idempotent trade_memory row keyed by IST date over the full resolved
  # history, so per-updater recompute was wasteful — once nightly suffices.
  schedule:
    - cron: '30 15 * * 1-5'  # 20:30 IST Mon-Fri (after market close)
  workflow_dispatch:

jobs:
  run-tier4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run Tier-4 Memory Manager
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python agents/tier4_memory_manager.py
