name: Health Monitor

on:
  schedule:
    - cron: '30 3 * * 1-5'    # 09:00 IST Mon-Fri — morning checks (2-6); Tier-0 stall check dormant pre-open (9:15)
    - cron: '30 4-9 * * 1-5'  # 10:00-15:00 IST hourly — live Tier-0 stall check (P2-8; is_market_open gated)
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health_monitor (alert-on-problem only)
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TIER3_CHANNEL: ${{ secrets.TELEGRAM_TIER3_CHANNEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u -m agents.health_monitor
