name: Tier-1 News Researcher

on:
  workflow_dispatch:
  schedule:
    # Every 30 min during NSE market hours (9:15 AM - 3:30 PM IST = 3:45-10:00 UTC)
    # Mon-Fri only, offset 15 min from Tier-0 to spread load
    - cron: '0,30 4-9 * * 1-5'
    - cron: '15,45 3-9 * * 1-5'

jobs:
  run-tier1-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tier-1 News Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TRADES_CHANNEL_ID: ${{ secrets.TELEGRAM_TRADES_CHANNEL_ID }}
          TELEGRAM_MOVERS_CHANNEL: ${{ secrets.TELEGRAM_MOVERS_CHANNEL }}
        run: python agents/tier1_news.py
