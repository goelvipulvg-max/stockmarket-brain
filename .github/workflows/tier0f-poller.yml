name: Tier-0F Poller

# P-1: 2-min cron-job.org dispatches + 10-min GH fallback can overlap; two
# concurrent runs could both read the same unpicked row before either marks it
# (mark-before-dispatch P2-14 only guards WITHIN a run) => double dispatch.
# Serialize runs; a queued run rescans everything unpicked, so nothing is lost.
concurrency:
  group: tier0f-poller-run
  cancel-in-progress: false

on:
  workflow_dispatch:  # Primary trigger via cron-job.org webhook (every 2 min)
  schedule:
    - cron: '*/10 3-9 * * 1-5'  # Fallback: every 10 min Mon-Fri ~8:30 AM-3:30 PM IST

jobs:
  run-poller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "GITHUB_PAT=${{ secrets.WORKFLOW_DISPATCH_PAT }}" >> .env
      - name: Run Tier-0F Poller
        env:
          USE_POLLER_CONFIDENCE_GATE: "false"
        run: python -m agents.tier0f_poller
