# ============================================================
# StockMarket-Brain | Tier-2 Swing Signal Agent
# ============================================================
# Schedule: Mon-Fri at 08:45 IST (03:15 UTC)
# Duration: ~2-3 min per run
# Output:   Telegram SWING channel
# Manual:   Actions tab → "Run workflow" button
# ============================================================

name: Tier-2 Swing Signals

on:
  # Cron schedule (UTC time)
  # 03:15 UTC = 08:45 IST | Mon-Fri only (Indian market days)
  # Note: GitHub free-tier cron may be 5-15 min delayed during peak hours
  schedule:
    - cron: "15 3 * * 1-5"

  # Manual trigger from GitHub UI (Actions tab)
  # Useful for testing and on-demand signal generation
  workflow_dispatch:

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Hard kill if script hangs

    steps:
      # Step 1: Checkout repo code
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: Setup Python 3.12 (matches local dev environment)
      # Built-in pip cache speeds up subsequent runs by ~1-2 min
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Tier-2 signal agent
      # Secrets injected as env vars - script reads via os.getenv()
      # load_dotenv() in script will silently no-op (no .env file in CI)
      - name: Run Tier-2 Signal Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SWING_CHANNEL: ${{ secrets.TELEGRAM_SWING_CHANNEL }}
        run: python agents/tier2_signals.py
