[pytest]
# Bare `pytest` must be safe:
# - testpaths: only tests/ is collected. The repo has collectable-named LIVE
#   scripts outside tests/ (scripts/test_telegram.py sends a real Telegram
#   message at import; sql/smoke_test.py, dumps/.../01_gate_a_smoke_test.py
#   match the *_test.py pattern).
# - integration-marked tests (live DB/API) excluded by default; run them
#   explicitly: pytest -m integration
# Phase-gate files are import-dangerous and gated via tests/conftest.py
# collect_ignore (override: RUN_LIVE_TESTS=1).
testpaths = tests
addopts = -m "not integration"
